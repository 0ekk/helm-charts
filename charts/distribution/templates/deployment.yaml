{{- if and .Values.gc.enabled (ne (.Values.replicaCount | int) 1) }}
{{- fail "gc.enabled requires replicaCount: 1 (GC runs as an initContainer with no other writer allowed)" }}
{{- end }}
{{- $usesFs := eq (include "distribution.usesFilesystemStorage" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distribution.fullname" . }}
  labels:
    {{- include "distribution.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if or $usesFs .Values.gc.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "distribution.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "distribution.config" . | sha256sum }}
      labels:
        {{- include "distribution.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "distribution.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.gc.enabled }}
      initContainers:
        - name: garbage-collect
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - 'registry garbage-collect {{ if .Values.gc.deleteUntagged }}--delete-untagged {{ end }}/etc/distribution/config.yml || echo "garbage-collect failed" >&2'
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/distribution
              readOnly: true
            {{- if $usesFs }}
            - name: storage
              mountPath: /var/lib/registry
            {{- end }}
      {{- end }}
      containers:
        - name: registry
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 5001
              protocol: TCP
            {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/distribution
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.auth.htpasswd.enabled }}
            - name: htpasswd
              mountPath: /etc/distribution/htpasswd
              subPath: {{ .Values.auth.htpasswd.secretKey }}
              readOnly: true
            {{- end }}
            {{- if $usesFs }}
            - name: storage
              mountPath: /var/lib/registry
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "distribution.fullname" . }}-config
        - name: tmp
          emptyDir: {}
        {{- if .Values.auth.htpasswd.enabled }}
        - name: htpasswd
          secret:
            secretName: {{ .Values.auth.htpasswd.existingSecret }}
        {{- end }}
        {{- if $usesFs }}
        - name: storage
          {{- if not .Values.persistence.enabled }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "distribution.fullname" .) }}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
