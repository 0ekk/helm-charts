apiVersion: v1
kind: Pod
metadata:
  name: {{ include "distribution.fullname" . }}-test-connection
  labels:
    {{- include "distribution.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) }}
      command:
        - wget
        - -qO-
        - "http://{{ include "distribution.fullname" . }}:{{ .Values.service.port }}/v2/"
